<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>造梦 · 故事空间 AR 空间编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f97316'/%3E%3Cpath d='M8 22 16 7l8 15h-4l-1.4-3H13.4L12 22H8Zm7-7h2l-1-2.2L15 15Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/remixicon/remixicon.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <div id="splat-studio" hidden></div>
  <div id="main">
    <aside id="outliner" class="panel"></aside>
    <section id="viewport-wrap">
      <div id="viewport"></div>
      <div id="viewport-overlay"></div>
    </section>
    <aside id="details" class="panel"></aside>
  </div>
  <footer id="dock" class="panel"></footer>
  <nav id="mobile-nav" aria-label="移动端编辑面板">
    <button type="button" data-mobile-panel="outliner"><i class="ri-node-tree"></i><span>大纲</span></button>
    <button type="button" data-mobile-panel="details"><i class="ri-settings-3-line"></i><span>属性</span></button>
    <button type="button" data-mobile-panel="dock"><i class="ri-folder-3-line"></i><span>资源</span></button>
    <button type="button" data-mobile-panel="more"><i class="ri-more-2-fill"></i><span>更多</span></button>
    <button type="button" data-mobile-panel="none"><i class="ri-focus-3-line"></i><span>视口</span></button>
  </nav>
  <section id="mobile-more" aria-label="更多编辑操作">
    <div class="mobile-more-head"><strong>更多操作</strong><button type="button" data-mobile-close aria-label="关闭更多操作"><i class="ri-close-line"></i></button></div>
    <div class="mobile-more-grid">
      <button type="button" data-mobile-action="project-new"><i class="ri-add-line"></i><span>新建工程</span></button>
      <button type="button" data-mobile-action="scene-new"><i class="ri-file-add-line"></i><span>新建场景</span></button>
      <button type="button" data-mobile-action="sync"><i class="ri-refresh-line"></i><span>同步线上</span></button>
      <button type="button" data-mobile-action="runtime"><i class="ri-smartphone-line"></i><span>游客 Runtime</span></button>
      <button type="button" data-mobile-action="anchor"><i class="ri-map-pin-line"></i><span>放置锚点</span></button>
      <button type="button" data-mobile-action="project-select"><i class="ri-folder-open-line"></i><span>切换工程</span></button>
    </div>
  </section>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
